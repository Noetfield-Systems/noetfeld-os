name: NOOS Independent Generated Code CI

on:
  pull_request:
    branches:
      - deploy/noos-loop-runner-entrypoint
    paths:
      - 'scripts/noos_agent_feature_*.py'
      - 'tests/test_noos_agent_feature_*.py'
      - '.github/workflows/noos-generated-code-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-generated-source:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install canonical requirements
        run: python -m pip install -r requirements.txt
      - name: Recheck exact generated modules and tests
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(tests/test_noos_agent_feature_*.py)
          if [ ${#files[@]} -lt 1 ]; then
            echo "No generated feature tests" >&2
            exit 1
          fi
          python -m compileall -q scripts tests
          python -m pytest -q "${files[@]}"
          git diff --check
