name: NOOS Inbox Worker Acceptance

on:
  pull_request:
    branches:
      - deploy/noos-loop-runner-entrypoint
    paths:
      - scripts/cloud_inbox_worker_v1.py
      - scripts/noos_loop_runner_v1.py
      - tests/test_cloud_inbox_worker_v1.py
      - tests/test_noos_loop_safe_failure_diagnostics_v1.py
      - .github/workflows/noos-inbox-worker-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inbox-worker-regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing runtime requirements
        run: python -m pip install -r requirements.txt
      - name: Compile and test live inbox priority / authority behavior
        run: |
          python -m compileall -q scripts/cloud_inbox_worker_v1.py scripts/noos_loop_runner_v1.py
          python -m pytest -q tests/test_cloud_inbox_worker_v1.py tests/test_noos_loop_safe_failure_diagnostics_v1.py
