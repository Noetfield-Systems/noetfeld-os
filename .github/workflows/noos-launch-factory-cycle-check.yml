name: NOOS Launch Factory role adapter
on:
  pull_request:
    paths:
      - 'scripts/launch_factory_company_cycle_v1.py'
      - 'tests/test_launch_factory_company_cycle_v1.py'
      - 'data/launch-factory-company-cycle-v1.json'
  push:
    paths:
      - 'scripts/launch_factory_company_cycle_v1.py'
      - 'tests/test_launch_factory_company_cycle_v1.py'
      - 'data/launch-factory-company-cycle-v1.json'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p 'test_launch_factory_company_cycle_v1.py'
