name: business-os-core-ci
on:
  pull_request:
    paths:
      - "apps/business-os-core/**"
      - ".github/workflows/business-os-core-ci.yml"
  push:
    branches: [platform/business-os-core-v1]
    paths:
      - "apps/business-os-core/**"
      - ".github/workflows/business-os-core-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI for route-level inbox tests
        run: python -m pip install --quiet "fastapi==0.115.12"
      - run: python -m py_compile apps/business-os-core/app.py apps/business-os-core/core.py
      - name: Verify premium Founder workspace interactions and source-backed states
        run: node apps/business-os-core/test_control_premium.cjs
      - run: python -m unittest discover -s apps/business-os-core -p "test_*.py"
      - name: Verify production Docker context contains every imported application module
        run: docker build --progress=plain -f apps/business-os-core/Dockerfile apps/business-os-core
