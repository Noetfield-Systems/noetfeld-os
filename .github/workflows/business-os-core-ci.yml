name: business-os-core-ci
on:
  push:
    branches: [platform/business-os-core-v1]
    paths:
      - "apps/business-os-core/**"
      - ".github/workflows/business-os-core-ci.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile apps/business-os-core/app.py apps/business-os-core/core.py
      - run: python -m unittest apps.business-os-core.test_routing
