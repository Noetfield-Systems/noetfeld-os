name: NOOS Autonomous Cloud Coder

on:
  issues:
    types: [opened]
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: read
  pull-requests: write
  id-token: write
  models: read

concurrency:
  group: noos-autonomous-cloud-coder
  cancel-in-progress: false

jobs:
  coding:
    if: github.event_name != 'issues' || (github.event.issue.user.login == 'kazemnezhadsina144-dot' && startsWith(github.event.issue.title, '[NOOS-CODE] '))
    runs-on: ubuntu-latest
    timeout-minutes: 14
    outputs:
      state: ${{ steps.run.outputs.state }}
      branch: ${{ steps.run.outputs.branch }}
      pr_url: ${{ steps.run.outputs.pr_url }}
      test_path: ${{ steps.run.outputs.test_path }}
      job_id: ${{ steps.run.outputs.job_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: deploy/noos-loop-runner-entrypoint
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Execute leased Company OS coding work
        id: run
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          NOOS_CODER_ROOT: ${{ github.workspace }}
        run: python scripts/noos_coding_agent_action_v1.py

  independent-verification-and-release:
    needs: coding
    if: needs.coding.outputs.state == 'PR_OPENED' || needs.coding.outputs.state == 'BRANCH_READY'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.coding.outputs.branch }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Independent test and verified fast-forward
        env:
          EXPECTED_BRANCH: ${{ needs.coding.outputs.branch }}
          EXPECTED_TEST: ${{ needs.coding.outputs.test_path }}
          EXPECTED_PR: ${{ needs.coding.outputs.pr_url }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$EXPECTED_BRANCH" in
            sina/noos-coder-*) ;;
            *) echo "Untrusted candidate branch"; exit 1 ;;
          esac
          case "$EXPECTED_TEST" in
            tests/test_noos_agent_feature_*.py) ;;
            *) echo "Unsafe test path"; exit 1 ;;
          esac

          gh auth setup-git
          git fetch origin deploy/noos-loop-runner-entrypoint
          BASE_SHA="$(git rev-parse origin/deploy/noos-loop-runner-entrypoint)"
          MERGE_BASE="$(git merge-base HEAD "$BASE_SHA")"
          test "$BASE_SHA" = "$MERGE_BASE" || {
            echo "Candidate is stale; refusing unverified rebase"; exit 1;
          }
          mapfile -t CHANGED < <(git diff --name-only "$BASE_SHA" HEAD)
          test "${#CHANGED[@]}" -eq 2 || {
            echo "Unexpected number of changed files"; exit 1;
          }
          test -f "$EXPECTED_TEST" || exit 1
          for file in "${CHANGED[@]}"; do
            case "$file" in
              scripts/noos_agent_feature_*.py | tests/test_noos_agent_feature_*.py) ;;
              *) echo "Unauthorized path: $file"; exit 1 ;;
            esac
          done
          if git diff --name-status "$BASE_SHA" HEAD | grep -Ev '^A[[:space:]]'; then
            echo "Only additive candidate files are authorized"; exit 1
          fi

          python -m compileall -q scripts tests
          python -m pytest -q "$EXPECTED_TEST"
          git diff --check "$BASE_SHA" HEAD
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          REMOTE_SHA="$(git ls-remote origin "refs/heads/$EXPECTED_BRANCH" | cut -f1)"
          test "$REMOTE_SHA" = "$CANDIDATE_SHA" || {
            echo "Remote branch differs from verified checkout"; exit 1;
          }
          git push origin "HEAD:refs/heads/deploy/noos-loop-runner-entrypoint"
          NEW_SHA="$(git ls-remote origin refs/heads/deploy/noos-loop-runner-entrypoint | cut -f1)"
          test "$NEW_SHA" = "$CANDIDATE_SHA" || exit 1
          echo "NOOS_VERIFIED_CODE_FAST_FORWARD=$NEW_SHA"
          echo "NOOS_RAILWAY_DEPLOY_PENDING_READBACK"
