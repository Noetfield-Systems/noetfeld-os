name: NOOS Postgres Coding Queue CI

on:
  pull_request:
    branches:
      - deploy/noos-loop-runner-entrypoint
    paths:
      - 'scripts/noos_postgres_store_v1.py'
      - 'scripts/noos_loop_runner_v1.py'
      - 'scripts/noos_loop_liveness_v1.py'
      - 'ops/railway/noos-loop-runner/server.py'
      - 'tests/test_noos_postgres_queue_v1.py'
      - '.github/workflows/noos-postgres-queue-ci.yml'
  push:
    branches:
      - deploy/noos-loop-runner-entrypoint
    paths:
      - 'scripts/noos_postgres_store_v1.py'
      - 'scripts/noos_loop_runner_v1.py'
      - 'scripts/noos_loop_liveness_v1.py'
      - 'ops/railway/noos-loop-runner/server.py'
      - 'tests/test_noos_postgres_queue_v1.py'
      - '.github/workflows/noos-postgres-queue-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  queue-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q scripts/noos_postgres_store_v1.py scripts/noos_loop_runner_v1.py scripts/noos_loop_liveness_v1.py ops/railway/noos-loop-runner/server.py
      - run: python -m pytest -q tests/test_noos_postgres_queue_v1.py
